# Nginx configuration for the production React frontend.
#
# In production, Vite is no longer running.
# Vite has already built the React application into static files
# inside /usr/share/nginx/html.
#
# Nginx has two main jobs here:
#
# 1. Serve the React static files.
# 2. Forward /api/* requests to the Node backend.
#
# It also handles React Router by falling back to index.html
# when a requested frontend route is not a real file.

server {
    listen 80; # Listen on port 80 for HTTP requests.
    server_name _;  # Accept requests regardless of the hostname.

    root /usr/share/nginx/html;  # Directory containing the built React application.
    index index.html;  # Default file to serve when a directory is requested and not a file.

    location /api/ {
        proxy_pass http://backend:4000; # Forward the request to the Node backend.
        proxy_http_version 1.1; # Use HTTP/1.1 when communicating with the backend.

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {  # Everything that isn't /api/ comes here.
        try_files $uri $uri/ /index.html;
    }
}