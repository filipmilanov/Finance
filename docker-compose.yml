services:
  db:
    image: postgres:16-alpine
    container_name: verdant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: verdant
      POSTGRES_PASSWORD: verdant
      POSTGRES_DB: verdant
    ports:
      - "5433:5432" # Change the host port to 5433 to avoid conflicts with local PostgreSQL installations
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdant -d verdant"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TODO: We dont need pgadmin in production, so we can remove it from the docker-compose file and use a local installation instead.
  # TODO: Remove pgadmin folder as well
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: verdant-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@verdant.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  pgadmin-data:
